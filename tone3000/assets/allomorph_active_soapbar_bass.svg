<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="45%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>

    <!-- Outer Bezel Linear -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3342"/>
      <stop offset="30%" stop-color="#181f2a"/>
      <stop offset="70%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#222a36"/>
    </linearGradient>

    <!-- Pickup Cover Gradient -->
    <linearGradient id="coverGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#242c3b"/>
      <stop offset="50%" stop-color="#181d26"/>
      <stop offset="100%" stop-color="#101319"/>
    </linearGradient>

    <!-- Metallic Pole Gradient -->
    <radialGradient id="poleGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- Steel String Linear -->
    <linearGradient id="stringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#f8fafc" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>

  <!-- Outer Precision Enclosure Bezel -->
  <rect x="24" y="24" width="1152" height="1152" rx="28" fill="none" stroke="url(#bezelGrad)" stroke-width="4"/>
  <rect x="36" y="36" width="1128" height="1128" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Technical Coordinate Grid -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="120" y1="60" x2="120" y2="1140"/>
    <line x1="240" y1="60" x2="240" y2="1140"/>
    <line x1="360" y1="60" x2="360" y2="1140"/>
    <line x1="480" y1="60" x2="480" y2="1140"/>
    <line x1="600" y1="60" x2="600" y2="1140" stroke-opacity="0.06"/>
    <line x1="720" y1="60" x2="720" y2="1140"/>
    <line x1="840" y1="60" x2="840" y2="1140"/>
    <line x1="960" y1="60" x2="960" y2="1140"/>
    <line x1="1080" y1="60" x2="1080" y2="1140"/>

    <line x1="60" y1="180" x2="1140" y2="180"/>
    <line x1="60" y1="300" x2="1140" y2="300"/>
    <line x1="60" y1="420" x2="1140" y2="420"/>
    <line x1="60" y1="540" x2="1140" y2="540"/>
    <line x1="60" y1="660" x2="1140" y2="660"/>
    <line x1="60" y1="780" x2="1140" y2="780"/>
    <line x1="60" y1="900" x2="1140" y2="900"/>
    <line x1="60" y1="1020" x2="1140" y2="1020"/>
  </g>

  <!-- Precision Corner Registration Crosshairs -->
  <g stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="60" y1="75" x2="90" y2="75"/><line x1="75" y1="60" x2="75" y2="90"/><circle cx="75" cy="75" r="5" fill="none"/>
    <line x1="1110" y1="75" x2="1140" y2="75"/><line x1="1125" y1="60" x2="1125" y2="90"/><circle cx="1125" cy="75" r="5" fill="none"/>
    <line x1="60" y1="1125" x2="90" y2="1125"/><line x1="75" y1="1110" x2="75" y2="1140"/><circle cx="75" cy="1125" r="5" fill="none"/>
    <line x1="1110" y1="1125" x2="1140" y2="1125"/><line x1="1125" y1="1110" x2="1125" y2="1140"/><circle cx="1125" cy="1125" r="5" fill="none"/>
  </g>

  <!-- Top Metadata Bar (Safely within margins at 130px and 1070px) -->
  <text x="130" y="80" fill="#94a3b8" font-size="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="3">// ALLOMORPH ANALOG TWIN PIPELINE</text>
  <text x="1070" y="80" fill="#94a3b8" font-size="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="3" text-anchor="end">TONE3000 EDITION // BLOCK 1 PREAMP</text>

  <!-- Primary Branding Header -->
  <g transform="translate(600, 175)">
    <text x="0" y="0" fill="#ffffff" font-size="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="14" text-anchor="middle">ALLOMORPH</text>
    <text x="0" y="40" fill="#94a3b8" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="6" text-anchor="middle">ANALOG PICKUP DIGITAL TWIN ARCHITECTURE</text>
  </g>

  <!-- Header Technical Divider -->
  <line x1="180" y1="245" x2="1020" y2="245" stroke="#334155" stroke-width="1"/>
  <line x1="520" y1="245" x2="680" y2="245" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- Center Hardware Visual &amp; Specs -->
  
                <!-- Background Flux Lines -->
                <g fill="none" stroke="#06b6d4" stroke-opacity="0.14" stroke-width="1.2">
                  <ellipse cx="600" cy="430" rx="220" ry="90"/>
                  <ellipse cx="600" cy="430" rx="290" ry="120" stroke-dasharray="8 6"/>
                  <ellipse cx="600" cy="670" rx="220" ry="90"/>
                  <ellipse cx="600" cy="670" rx="290" ry="120" stroke-dasharray="8 6"/>
                </g>
                <!-- RLC Inductance Curve -->
                <path d="M 160 770 Q 360 765 500 700 T 640 550 T 780 700 T 1040 810" fill="none" stroke="#06b6d4" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="6 6"/>
                <!-- Neck and Bridge Active Soapbars (Neck cy=430, Bridge cy=670: 80px gap) -->
                
    <!-- Active Soapbar Pickup at 600.0, 430.0 (NECK SOAPBAR) -->
    <g filter="url(#dropShadow)">
      <!-- Main Soapbar Casing -->
      <rect x="412.5" y="350.0" width="375.0" height="160.0" rx="13.5" fill="url(#coverGrad)" stroke="#334155" stroke-width="1.8"/>
      <rect x="415.5" y="353.0" width="369.0" height="154.0" rx="11.5" fill="none" stroke="#64748b" stroke-width="0.75" opacity="0.4"/>
      <rect x="418.5" y="356.0" width="363.0" height="148.0" rx="9.5" fill="#0d1117" stroke="#1c2330" stroke-width="1.2"/>

      <!-- Inset Mounting Tabs & Screw Recesses (EMG-X style) -->
      <!-- Left Inset Recess -->
      <path d="M 418.5 410.0 A 20 20 0 0 1 418.5 450.0 Z" fill="#080a0f" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="426.0" cy="430.0" r="4.2" fill="#080a0f" stroke="#475569" stroke-width="1"/>
      <circle cx="426.0" cy="430.0" r="1.8" fill="#1e293b"/>

      <!-- Right Inset Recess -->
      <path d="M 781.5 410.0 A 20 20 0 0 0 781.5 450.0 Z" fill="#080a0f" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="774.0" cy="430.0" r="4.2" fill="#080a0f" stroke="#475569" stroke-width="1"/>
      <circle cx="774.0" cy="430.0" r="1.8" fill="#1e293b"/>

      <!-- Internal Dual Sensing Blade Rails -->
      <!-- Upper Blade Rail -->
      <rect x="455.0" y="395.0" width="290" height="6" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="458.0" y="397.0" width="284" height="2" rx="1" fill="#06b6d4" fill-opacity="0.6"/>
      <!-- Lower Blade Rail -->
      <rect x="455.0" y="459.0" width="290" height="6" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="458.0" y="461.0" width="284" height="2" rx="1" fill="#06b6d4" fill-opacity="0.6"/>

      <!-- Internal Coil Boundary Indication -->
      <rect x="436.5" y="366.0" width="327.0" height="128.0" rx="8" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="6 6"/>

      <!-- Corner Technical Markings (EMG Style) -->
      <text x="763.5" y="496.0" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1" text-anchor="end">ACTIVE DUAL-BLADE</text>
    </g>
    
                
    <!-- Active Soapbar Pickup at 600.0, 670.0 (BRIDGE SOAPBAR) -->
    <g filter="url(#dropShadow)">
      <!-- Main Soapbar Casing -->
      <rect x="412.5" y="590.0" width="375.0" height="160.0" rx="13.5" fill="url(#coverGrad)" stroke="#334155" stroke-width="1.8"/>
      <rect x="415.5" y="593.0" width="369.0" height="154.0" rx="11.5" fill="none" stroke="#64748b" stroke-width="0.75" opacity="0.4"/>
      <rect x="418.5" y="596.0" width="363.0" height="148.0" rx="9.5" fill="#0d1117" stroke="#1c2330" stroke-width="1.2"/>

      <!-- Inset Mounting Tabs & Screw Recesses (EMG-X style) -->
      <!-- Left Inset Recess -->
      <path d="M 418.5 650.0 A 20 20 0 0 1 418.5 690.0 Z" fill="#080a0f" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="426.0" cy="670.0" r="4.2" fill="#080a0f" stroke="#475569" stroke-width="1"/>
      <circle cx="426.0" cy="670.0" r="1.8" fill="#1e293b"/>

      <!-- Right Inset Recess -->
      <path d="M 781.5 650.0 A 20 20 0 0 0 781.5 690.0 Z" fill="#080a0f" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="774.0" cy="670.0" r="4.2" fill="#080a0f" stroke="#475569" stroke-width="1"/>
      <circle cx="774.0" cy="670.0" r="1.8" fill="#1e293b"/>

      <!-- Internal Dual Sensing Blade Rails -->
      <!-- Upper Blade Rail -->
      <rect x="455.0" y="635.0" width="290" height="6" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="458.0" y="637.0" width="284" height="2" rx="1" fill="#06b6d4" fill-opacity="0.6"/>
      <!-- Lower Blade Rail -->
      <rect x="455.0" y="699.0" width="290" height="6" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="458.0" y="701.0" width="284" height="2" rx="1" fill="#06b6d4" fill-opacity="0.6"/>

      <!-- Internal Coil Boundary Indication -->
      <rect x="436.5" y="606.0" width="327.0" height="128.0" rx="8" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="6 6"/>

      <!-- Corner Technical Markings (EMG Style) -->
      <text x="763.5" y="736.0" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1" text-anchor="end">ACTIVE DUAL-BLADE</text>
    </g>
    
                <!-- Datum labels (Word-wrapped and safely placed within margins >= 130px) -->
                <g font-family="system-ui, -apple-system, sans-serif" fill="#cbd5e1" font-weight="800" letter-spacing="1">
                  <!-- Left Datums -->
                  <text x="130" y="422" font-size="14">NECK SOAPBAR</text>
                  <text x="130" y="442" font-size="12" fill="#94a3b8" font-weight="600">135.0mm DATUM</text>
                  <line x1="130" y1="452" x2="385" y2="452" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>

                  <text x="130" y="662" font-size="14">BRIDGE SOAPBAR</text>
                  <text x="130" y="682" font-size="12" fill="#94a3b8" font-weight="600">55.0mm DATUM</text>
                  <line x1="130" y1="692" x2="385" y2="692" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>

                  <!-- Right Datum -->
                  <text x="1070" y="540" text-anchor="end" font-size="14">ACTIVE BUFFER</text>
                  <text x="1070" y="560" text-anchor="end" font-size="12" fill="#94a3b8" font-weight="600">LOW-Z DUAL BLADES</text>
                  <line x1="815" y1="570" x2="1070" y2="570" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
                </g>
            

  <!-- Physical Bass Strings (Vertical Over Pickups) -->
  <g>
    <!-- E String (Heavy Gauge ~4.8px) -->
    <line x1="480.0" y1="295" x2="480.0" y2="820" stroke="url(#stringGrad)" stroke-width="4.8"/>
    <line x1="480.0" y1="295" x2="480.0" y2="820" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <text x="480.0" y="282" fill="#94a3b8" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle">E (105)</text>

    <!-- A String (Gauge ~3.8px) -->
    <line x1="560.0" y1="295" x2="560.0" y2="820" stroke="url(#stringGrad)" stroke-width="3.8"/>
    <line x1="560.0" y1="295" x2="560.0" y2="820" stroke="#ffffff" stroke-width="0.7" opacity="0.6"/>
    <text x="560.0" y="282" fill="#94a3b8" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle">A (85)</text>

    <!-- D String (Gauge ~3.0px) -->
    <line x1="640.0" y1="295" x2="640.0" y2="820" stroke="url(#stringGrad)" stroke-width="3.0"/>
    <line x1="640.0" y1="295" x2="640.0" y2="820" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    <text x="640.0" y="282" fill="#94a3b8" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle">D (65)</text>

    <!-- G String (Gauge ~2.2px) -->
    <line x1="720.0" y1="295" x2="720.0" y2="820" stroke="url(#stringGrad)" stroke-width="2.2"/>
    <line x1="720.0" y1="295" x2="720.0" y2="820" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
    <text x="720.0" y="282" fill="#94a3b8" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle">G (45)</text>
  </g>

  <!-- Bottom Hero Section -->
  <!-- Accent Line -->
  <line x1="130" y1="860" x2="1070" y2="860" stroke="#1e293b" stroke-width="2"/>
  <line x1="130" y1="860" x2="420" y2="860" stroke="#06b6d4" stroke-width="3.5"/>

  <!-- Edition Title -->
  <text x="130" y="915" fill="#ffffff" font-size="46" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="3">ACTIVE SOAPBAR BASS</text>
  
  <!-- Edition Subtitle / Voicing Count -->
  <text x="130" y="955" fill="#06b6d4" font-size="19" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="2.5">22 DIGITAL TWIN VOICINGS  //  HIGH-IMPEDANCE PASSIVE EMULATION</text>
  
  <!-- Word-Wrapped Description (Line 1 & Line 2, safe margins >= 130px) -->
  <text x="130" y="988" fill="#cbd5e1" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="600" letter-spacing="0.5">Calibrated for 34&quot; Modern Active Dual-Soapbar Bass</text>
  <text x="130" y="1012" fill="#94a3b8" font-size="15" font-family="system-ui, -apple-system, sans-serif" font-weight="500" letter-spacing="0.5">Dual-Blade Humbuckers • Active 3-Band Preamp Buffer • Low-Z Output</text>

  <!-- Bottom Hardware Specification Chips (Comfortable widths, safe within margin) -->
  <g transform="translate(130, 1042)">
    <!-- Chip 1 (Scale) -->
    <rect x="0" y="0" width="165" height="42" rx="8" fill="#141822" stroke="#2a3344" stroke-width="1.6"/>
    <text x="82" y="27" fill="#f8fafc" font-size="14.5" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1" text-anchor="middle">34&quot; SCALE</text>

    <!-- Chip 2 (Pickup Style) -->
    <rect x="178" y="0" width="195" height="42" rx="8" fill="#141822" stroke="#2a3344" stroke-width="1.6"/>
    <text x="275" y="27" fill="#f8fafc" font-size="14.5" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1" text-anchor="middle">DUAL SOAPBARS</text>

    <!-- Chip 3 (Topology) -->
    <rect x="386" y="0" width="225" height="42" rx="8" fill="#141822" stroke="#2a3344" stroke-width="1.6"/>
    <text x="498" y="27" fill="#f8fafc" font-size="14.5" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1" text-anchor="middle">ACTIVE 3-BAND PREAMP</text>

    <!-- Chip 4 (Platform) -->
    <rect x="624" y="0" width="195" height="42" rx="8" fill="#141822" stroke="#2a3344" stroke-width="1.6"/>
    <text x="721" y="27" fill="#f8fafc" font-size="14.5" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1" text-anchor="middle">BLOCK 1 NAM + IR</text>

    <!-- Chip 5 (Certified) -->
    <rect x="832" y="0" width="105" height="42" rx="8" fill="#182030" stroke="#06b6d4" stroke-width="1.6"/>
    <text x="884" y="27" fill="#06b6d4" font-size="14.5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="1" text-anchor="middle">NAM A2</text>
  </g>
</svg>
