<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Background Radial Gradient: Rich graphite slate center fading smoothly to deep black -->
    <radialGradient id="bgGrad" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#222b3b"/>
      <stop offset="35%" stop-color="#151b25"/>
      <stop offset="70%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>

    <!-- Outer Bezel Linear -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#2a374a"/>
      <stop offset="70%" stop-color="#141c28"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Silky-Smooth Studio Backlight Bloom: Pure accent color diffusion with zero hard boundaries -->
    <radialGradient id="heroGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Pickup Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b485d"/>
      <stop offset="35%" stop-color="#263142"/>
      <stop offset="100%" stop-color="#151b24"/>
    </linearGradient>

    <!-- Metallic Pole Gradient -->
    <radialGradient id="poleGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <!-- Steel String Linear (High-Gloss Steel) -->
    <linearGradient id="stringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Clean Drop Shadow: Generous filter region so no blur clipping occurs -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.92"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="stringShadow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.80"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>
  <!-- Seamless Studio Backlight Bloom across canvas (no shape clipping) -->
  <rect width="1200" height="1200" fill="url(#heroGlow)"/>
  

  <!-- Outer Precision Enclosure Bezel -->
  <rect x="24" y="24" width="1152" height="1152" rx="32" fill="none" stroke="url(#bezelGrad)" stroke-width="4"/>
  <rect x="36" y="36" width="1128" height="1128" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Precision Corner Registration Crosshairs -->
  <g stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.85">
    <line x1="60" y1="75" x2="90" y2="75"/><line x1="75" y1="60" x2="75" y2="90"/><circle cx="75" cy="75" r="6" fill="none"/>
    <line x1="1110" y1="75" x2="1140" y2="75"/><line x1="1125" y1="60" x2="1125" y2="90"/><circle cx="1125" cy="75" r="6" fill="none"/>
    <line x1="60" y1="1125" x2="90" y2="1125"/><line x1="75" y1="1110" x2="75" y2="1140"/><circle cx="75" cy="1125" r="6" fill="none"/>
    <line x1="1110" y1="1125" x2="1140" y2="1125"/><line x1="1125" y1="1110" x2="1125" y2="1140"/><circle cx="1125" cy="1125" r="6" fill="none"/>
  </g>

  <!-- Primary Branding Header: Perfectly balanced from top -->
  <g transform="translate(600, 184)">
    <text x="0" y="0" fill="#ffffff" font-size="108" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="16" text-anchor="middle">ALLOMORPH</text>
    <text x="0" y="46" fill="#f59e0b" font-size="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="6" text-anchor="middle">ANALOG PICKUP DIGITAL TWINS</text>
  </g>

  <!-- Header Technical Divider -->
  <line x1="80" y1="270" x2="1120" y2="270" stroke="#334155" stroke-width="2"/>
  <line x1="440" y1="270" x2="760" y2="270" stroke="#f59e0b" stroke-width="4.5"/>

  <!-- Center Hero Pickup & Strings Container -->
  <g transform="translate(600, 550.0) scale(1.35) translate(-600, -515)">
    
                
    <!-- P-Bass Bobbin Half at 520.0, 458.0 (BASS E/A) -->
    <g filter="url(#dropShadow)">
      <!-- Left Mounting Tab -->
      <path d="M 400.0 433.8 A 25 25 0 0 0 400.0 482.2 Z" fill="url(#coverGrad)" stroke="#475569" stroke-width="2.2"/>
      <circle cx="389.0" cy="458.0" r="4.5" fill="#0d1117" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="389.0" cy="458.0" r="2.0" fill="#334155"/>

      <!-- Right Mounting Tab -->
      <path d="M 640.0 433.8 A 25 25 0 0 1 640.0 482.2 Z" fill="url(#coverGrad)" stroke="#475569" stroke-width="2.2"/>
      <circle cx="651.0" cy="458.0" r="4.5" fill="#0d1117" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="651.0" cy="458.0" r="2.0" fill="#334155"/>

      <!-- Main Bobbin Casing with Chamfer Bevel -->
      <rect x="400.0" y="401.0" width="240.0" height="114.0" rx="13.5" fill="url(#coverGrad)" stroke="#64748b" stroke-width="3.0"/>
      <rect x="402.0" y="403.0" width="236.0" height="110.0" rx="12.5" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
      <rect x="407.0" y="408.0" width="226.0" height="100.0" rx="9.5" fill="#161c26" stroke="#2a374a" stroke-width="1.5"/>

      <!-- Internal Coil Indicator -->
      <rect x="416.0" y="417.0" width="208.0" height="82.0" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.0" stroke-opacity="0.45" stroke-dasharray="5 5"/>
      
      <!-- 4 Poles (2 pairs straddling each string) -->
      
    <!-- Pole piece at 465.0, 458.0 -->
    <g transform="translate(465.0, 458.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
      
    <!-- Pole piece at 495.0, 458.0 -->
    <g transform="translate(495.0, 458.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
      
    <!-- Pole piece at 545.0, 458.0 -->
    <g transform="translate(545.0, 458.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
      
    <!-- Pole piece at 575.0, 458.0 -->
    <g transform="translate(575.0, 458.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
    </g>
    
                
    <!-- P-Bass Bobbin Half at 680.0, 572.0 (TREBLE D/G) -->
    <g filter="url(#dropShadow)">
      <!-- Left Mounting Tab -->
      <path d="M 560.0 547.8 A 25 25 0 0 0 560.0 596.2 Z" fill="url(#coverGrad)" stroke="#475569" stroke-width="2.2"/>
      <circle cx="549.0" cy="572.0" r="4.5" fill="#0d1117" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="549.0" cy="572.0" r="2.0" fill="#334155"/>

      <!-- Right Mounting Tab -->
      <path d="M 800.0 547.8 A 25 25 0 0 1 800.0 596.2 Z" fill="url(#coverGrad)" stroke="#475569" stroke-width="2.2"/>
      <circle cx="811.0" cy="572.0" r="4.5" fill="#0d1117" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="811.0" cy="572.0" r="2.0" fill="#334155"/>

      <!-- Main Bobbin Casing with Chamfer Bevel -->
      <rect x="560.0" y="515.0" width="240.0" height="114.0" rx="13.5" fill="url(#coverGrad)" stroke="#64748b" stroke-width="3.0"/>
      <rect x="562.0" y="517.0" width="236.0" height="110.0" rx="12.5" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
      <rect x="567.0" y="522.0" width="226.0" height="100.0" rx="9.5" fill="#161c26" stroke="#2a374a" stroke-width="1.5"/>

      <!-- Internal Coil Indicator -->
      <rect x="576.0" y="531.0" width="208.0" height="82.0" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.0" stroke-opacity="0.45" stroke-dasharray="5 5"/>
      
      <!-- 4 Poles (2 pairs straddling each string) -->
      
    <!-- Pole piece at 625.0, 572.0 -->
    <g transform="translate(625.0, 572.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
      
    <!-- Pole piece at 655.0, 572.0 -->
    <g transform="translate(655.0, 572.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
      
    <!-- Pole piece at 705.0, 572.0 -->
    <g transform="translate(705.0, 572.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
      
    <!-- Pole piece at 735.0, 572.0 -->
    <g transform="translate(735.0, 572.0)">
      <circle cx="0" cy="0" r="13.0" fill="#080a0f" opacity="0.85"/>
      <circle cx="0" cy="0" r="11.0" fill="url(#poleGrad)"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#f8fafc" stroke-width="0.85" opacity="0.75"/>
      <ellipse cx="-2.5" cy="-2.5" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.65" transform="rotate(-30, -2.5, -2.5)"/>
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5"/>
    </g>
    
    </g>
    
                

      <!-- Physical Bass Strings (4 Strings) -->
    <g filter="url(#stringShadow)">
      <!-- E String -->
      <line x1="480.0" y1="307.6" x2="480.0" y2="722.4" stroke="url(#stringGrad)" stroke-width="16.0"/>
      <line x1="480.0" y1="307.6" x2="480.0" y2="722.4" stroke="#ffffff" stroke-width="3.5" opacity="0.95"/>

      <!-- A String -->
      <line x1="560.0" y1="307.6" x2="560.0" y2="722.4" stroke="url(#stringGrad)" stroke-width="13.5"/>
      <line x1="560.0" y1="307.6" x2="560.0" y2="722.4" stroke="#ffffff" stroke-width="3.0" opacity="0.95"/>

      <!-- D String -->
      <line x1="640.0" y1="307.6" x2="640.0" y2="722.4" stroke="url(#stringGrad)" stroke-width="11.5"/>
      <line x1="640.0" y1="307.6" x2="640.0" y2="722.4" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>

      <!-- G String -->
      <line x1="720.0" y1="307.6" x2="720.0" y2="722.4" stroke="url(#stringGrad)" stroke-width="9.0"/>
      <line x1="720.0" y1="307.6" x2="720.0" y2="722.4" stroke="#ffffff" stroke-width="2.2" opacity="0.95"/>
    </g>
  </g>

  <!-- Bottom Hero Section -->
  <line x1="80" y1="830" x2="1120" y2="830" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="830" x2="420" y2="830" stroke="#f59e0b" stroke-width="4.5"/>

  <!-- Tone Pack Title (BIG & BOLD) -->
  <text x="80" y="902" fill="#ffffff" font-size="66" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="1.5">STANDARD PRECISION BASS</text>
  
  <!-- Edition Subtitle / Voicing Count (BIG & BOLD) -->
  <text x="80" y="960" fill="#f59e0b" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="3.0">21 DIGITAL TWIN VOICINGS</text>
  
  <!-- Specification Badges (3 Large High-Contrast Badges) -->
  <g transform="translate(0, 1000)">
    <!-- Badge 1 (Scale) -->
    <rect x="80" y="0" width="230" height="68" rx="16" fill="#141a24" stroke="#3b485d" stroke-width="2.2"/>
    <text x="195" y="43" fill="#f8fafc" font-size="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1.5" text-anchor="middle">34" SCALE</text>

    <!-- Badge 2 (Pickup) -->
    <rect x="330" y="0" width="370" height="68" rx="16" fill="#141a24" stroke="#3b485d" stroke-width="2.2"/>
    <text x="515" y="43" fill="#f8fafc" font-size="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="1.5" text-anchor="middle">ALNICO SPLIT-P</text>

    <!-- Badge 3 (Target / Platform) -->
    <rect x="720" y="0" width="400" height="68" rx="16" fill="#141a24" stroke="#f59e0b" stroke-width="3.0"/>
    <text x="920" y="43" fill="#f59e0b" font-size="22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="1.5" text-anchor="middle">FOR NAM &amp; ANAGRAM</text>
  </g>
</svg>