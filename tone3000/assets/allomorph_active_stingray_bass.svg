                  <line x1="820" y1="562" x2="1070" y2="562" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
                </g>
            

  <!-- Physical Bass Strings (Vertical Over Pickups) -->
  <g>
    <!-- E String (Heavy Gauge ~4.8px) -->
    <line x1="480.0" y1="295" x2="480.0" y2="820" stroke="url(#stringGrad)" stroke-width="4.8"/>
    <line x1="480.0" y1="295" x2="480.0" y2="820" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
