                <!-- Music Man Sweet-Spot Humbucker centered at cy=550 -->
                
    <!-- Music Man StingRay Humbucker at 600.0, 550.0 (SWEET-SPOT HUMBUCKER) -->
    <g filter="url(#dropShadow)">
      <!-- Left Upper Mounting Tab (Bass Side) -->
      <path d="M 410.0 478.0 A 20 20 0 0 0 410.0 514.0 Z" fill="url(#coverGrad)" stroke="#222938" stroke-width="1.8"/>
