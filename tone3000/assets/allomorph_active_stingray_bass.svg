      <circle cx="402.0" cy="604.0" r="4.0" fill="#080a0f" stroke="#475569" stroke-width="1"/>
      <circle cx="402.0" cy="604.0" r="1.8" fill="#1e293b"/>

      <!-- Right Center Mounting Tab (Treble Side - Single Ear) -->
