# ==============================================================================
# PASSIVIZER SOURCE INSTRUMENT CONFIGURATION
# 30" Short Scale Bass with Active 18V EMG MMTW
# ==============================================================================
# Physical Datum: Centerline located 77.5mm from bridge saddle (303.5mm from 12th fret).
# Pickup Hardware: Active EMG MMTW with internal push/pull dual-mode preamp.
#   - Dual-Coil Mode: Coils L1 (neck) + L2 (bridge) in parallel (2.50 kHz fr).
#   - Single-Coil Mode: Coils L2 + L3 (bridge-side stacked hum-canceler, 3.50 kHz fr).

id = "30in_emg_mmtw"
name = "30\" Short Scale MM (EMG MMTW)"
scale_length_in = 30.0
scale_length_m = 0.762

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [62.79, 83.82, 111.89, 149.35]

# Default pickup setting when not overridden by voice mapping
default_pickup = "mmtw_dual"

# ------------------------------------------------------------------------------
# 1. DUAL-COIL MODE (Push/Pull Down: Humbucking Music Man Sound)
# ------------------------------------------------------------------------------
[pickups.mmtw_dual]
name = "EMG MMTW Dual-Coil (Centerline)"
position_from_bridge_m = 0.0775  # 77.5mm centerline
aperture_width_in = 1.50         # Overall pickup housing sensing envelope
coil_spacing_in = 0.90           # 0.90" (22.86mm) spacing between coil centers
type = "dual_coil_parallel"
resonant_frequency_hz = 2500.0   # Internal active preamp resonance (from EMG datasheet)
q_factor = 1.35                  # Quality factor of the active resonant peak

# Multi-coil spatial standing wave breakdown:
coils = [
    { strings = ["all"], position_from_bridge_m = 0.08893, aperture_width_in = 0.75, weight = 0.5 }, # L1 (Neck)
    { strings = ["all"], position_from_bridge_m = 0.06607, aperture_width_in = 0.75, weight = 0.5 }  # L2 (Bridge)
]

# ------------------------------------------------------------------------------
# 2. SINGLE-COIL MODE (Push/Pull Up: J-Style Single-Coil Sound)
# ------------------------------------------------------------------------------
# Note: EMG MMTW switches strictly to the bridge-side stacked coils (L2 + L3).
# L2 is the active sensing coil; L3 is a phantom dummy coil underneath for hum cancellation.
[pickups.mmtw_single]
name = "EMG MMTW Single-Coil (Bridge Coil)"
position_from_bridge_m = 0.06607 # 66.07mm (L2 coil center)
aperture_width_in = 0.75         # Narrow 0.75" single-coil aperture
coil_spacing_in = 0.0            # Single sensing line (no humbucker comb notch)
type = "single_coil"
resonant_frequency_hz = 3500.0   # Higher active resonance for single-coil clarity
q_factor = 1.40
coils = [
    { strings = ["all"], position_from_bridge_m = 0.06607, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 3. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the trainer/prefilter which physical pickup state the player selects
# when recording sweeps or playing through the target digital twin.
[pickup_mapping]
"01_jazz_bass_pair" = "mmtw_dual"
"02_jazz_bridge_70s" = "mmtw_single"      # Uses single-coil mode for authentic 70s J bridge bite
"03_modern_p_ceramic" = "mmtw_dual"
"04_vintage_62_p_alnico" = "mmtw_dual"
"05_p_bass_47nf_rolloff" = "mmtw_dual"
"06_pj_hybrid_parallel" = "mmtw_dual"
"07_stingray_mm_parallel" = "mmtw_dual"   # Uses dual-coil mode for StingRay authority
"08_rickenbacker_bridge_hpf" = "mmtw_single" # Uses single-coil mode for Rickenbacker presence
"09_pmm_hybrid_series" = "mmtw_dual"
"10_mudbucker_ultra_series" = "mmtw_dual"
"11_dingwall_multiscale_bridge" = "mmtw_dual"
