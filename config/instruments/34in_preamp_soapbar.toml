# ==============================================================================
# ALLOMORPH SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Preamp Soapbar Bass (Ibanez SR / Yamaha TRBX / Schecter)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Modern Neck Soapbar: Centerline 135.0mm from bridge saddle (296.8mm from 12th fret)
#       - Dual blade coils: forward coil 143.25mm, rearward coil 126.75mm (spacing d = 0.65" / 16.51mm)
#       - Aperture width: 1.35" (34.3mm)
#   - Modern Bridge Soapbar: Centerline 55.0mm from bridge saddle (376.8mm from 12th fret)
#       - Dual blade coils: forward coil 63.25mm, rearward coil 46.75mm (spacing d = 0.65" / 16.51mm)
#       - Aperture width: 1.35" (34.3mm)
# Electronics:
#   - Dual passive ceramic dual-blade soapbar humbuckers (Bartolini MK-1 / Ibanez PowerSpan / Yamaha YGD spec).
#   - Onboard active 9V 3-band preamp buffer (Ibanez Custom Electronics / Yamaha Active / Cort Markbass).
#   - Active buffer provides high input impedance (1.0 MΩ), completely isolating passive coils from cable capacitance.
#   - Set to center detents (flat 0 dB EQ response, finite DC transmission H(0) >= 1.0).
#   - Low output impedance (< 100 Ω) direct to output jack / Anagram Block 1.
# Circuit Parameters:
#   - Neck Soapbar: L = 3.8H, Rdc = 8.6kΩ, Reddy = 95kΩ, Ccoil = 95pF (loaded fr = 3.80 kHz, Q = 1.45).
#   - Bridge Soapbar: L = 4.2H, Rdc = 9.4kΩ, Reddy = 90kΩ, Ccoil = 95pF (loaded fr = 4.10 kHz, Q = 1.40).
#   - Parallel center blend: 500k volume/blend pot, loaded fr = 3.95 kHz, Q = 1.35.

id = "34in_preamp_soapbar"
name = "34\" Preamp Soapbar Bass (Dual Humbuckers)"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "active"

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard nickel roundwounds (D'Addario EXL165 .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. PASSIVE SOAPBAR + ACTIVE PREAMP (Neck Solo)
# ------------------------------------------------------------------------------
[pickups.neck]
name = "Passive Soapbar with Preamp (Neck)"
position_name = "Neck"
position_from_bridge_m = 0.1350  # 135.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-blade soapbar housing
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-blade spacing
type = "dual_coil_parallel"
magnet_type = "ceramic"
pole_type = "blade"
resonant_frequency_hz = 3800.0   # Active buffered loaded resonance
q_factor = 1.45
coils = [
    { strings = ["all"], position_from_bridge_m = 0.14325, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" },
    { strings = ["all"], position_from_bridge_m = 0.12675, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" }
]

[pickups.neck.circuit]
topology = "single"
L = 3.8
Rdc = 8600.0
Reddy = 95000.0
Ccoil = 9.5e-11
active = true
preamp = "none"
Rvol = 500000.0

# ------------------------------------------------------------------------------
# 2. PASSIVE SOAPBAR + ACTIVE PREAMP (Bridge Solo)
# ------------------------------------------------------------------------------
[pickups.bridge]
name = "Passive Soapbar with Preamp (Bridge)"
position_name = "Bridge"
position_from_bridge_m = 0.0550  # 55.0mm from bridge
aperture_width_in = 1.35         # 1.35" dual-blade soapbar housing
coil_spacing_in = 0.65           # 0.65" (16.51mm) internal dual-blade spacing
type = "dual_coil_parallel"
magnet_type = "ceramic"
pole_type = "blade"
resonant_frequency_hz = 4100.0   # Active buffered loaded resonance
q_factor = 1.40
coils = [
    { strings = ["all"], position_from_bridge_m = 0.06325, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" },
    { strings = ["all"], position_from_bridge_m = 0.04675, aperture_width_in = 0.65, weight = 0.5, pole_type = "blade" }
]

[pickups.bridge.circuit]
topology = "single"
L = 4.2
Rdc = 9400.0
Reddy = 90000.0
Ccoil = 9.5e-11
active = true
preamp = "none"
Rvol = 500000.0

# ------------------------------------------------------------------------------
# 3. PASSIVE SOAPBARS PARALLEL + ACTIVE PREAMP (Blend Center Detent / 50-50)
# ------------------------------------------------------------------------------
[pickups.pair_parallel]
name = "Passive Soapbars Parallel with Preamp (Center Detent)"
position_name = "Parallel"
position_from_bridge_m = 0.0950  # Acoustic centroid (135.0mm + 55.0mm) / 2
aperture_width_in = 1.35
coil_spacing_in = 0.0
type = "composite"
magnet_type = "ceramic"
pole_type = "blade"
resonant_frequency_hz = 3950.0   # Blended active resonance
q_factor = 1.35
components = [
    { pickup = "neck", weight = 0.5 },
    { pickup = "bridge", weight = 0.5 }
]

[pickups.pair_parallel.circuit]
topology = "parallel"
active = true
preamp = "none"
Rvol = 500000.0

[pickups.pair_parallel.circuit.neck]
L = 3.8
Rdc = 8600.0
Reddy = 95000.0
Ccoil = 9.5e-11

[pickups.pair_parallel.circuit.bridge]
L = 4.2
Rdc = 9400.0
Reddy = 90000.0
Ccoil = 9.5e-11

# ------------------------------------------------------------------------------
# 4. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the player to select the closest physical pickup state on the Soapbar Bass:
#   - Neck Solo: Precision bass voicings, Mudbucker, and Upright acoustic depth
#   - Bridge Solo: 60s Jazz bridge growl, StingRay bite, and Rickenbacker clank
#   - Both Parallel: Modern active slap, dual-coil clarity, and hybrid authority

[pickup_mapping]
"01_modern_jazz_active" = "pair_parallel"
"02_jazz_bass_pair" = "pair_parallel"
"02b_jazz_bass_pair_22nf" = "pair_parallel"
"02c_jazz_bridge_growl_bias" = "bridge"
"03_jazz_bridge_60s" = "bridge"
"04_modern_p_ceramic" = "neck"
"05_vintage_62_p_alnico" = "neck"
"05b_vintage_62_p_22nf" = "neck"
"05c_vintage_62_p_47nf" = "neck"
"05d_vintage_50s_p_100nf" = "neck"
"07_modern_pj_active" = "pair_parallel"
"08_vintage_pj_passive" = "pair_parallel"
"09_stingray_mm_parallel" = "bridge"
"09b_stingray_mm_series" = "bridge"
"10_rickenbacker_bridge_hpf" = "bridge"
"11_modern_pmm_active" = "pair_parallel"
"11b_pmm_hybrid_series" = "pair_parallel"
"12_mudbucker_ultra_series" = "neck"
"13_dingwall_multiscale_bridge" = "bridge"
"14_upright_bridge_transducer" = "neck"
