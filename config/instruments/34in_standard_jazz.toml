# ==============================================================================
# PASSIVIZER SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Jazz Bass (Neck + Bridge Single Coils)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - Neck Single-Coil: 148.0mm from bridge saddle (283.8mm from 12th fret)
#   - 70s Bridge Single-Coil: 40.6mm from bridge saddle (391.2mm from 12th fret)
#   - Coil Aperture: 0.75" (19.05mm) narrow single-coil magnetic sensing envelope
# Electronics:
#   - Passive high-impedance circuit: Dual 250k volume pots (V/V/T), 250k master tone (47nF cap).
#   - Parallel summing loaded resonance: 3.90 kHz, Q = 1.30.
#   - Solo Neck loaded resonance: 3.60 kHz, Q = 1.50.
#   - Solo Bridge loaded resonance: 3.20 kHz, Q = 1.60.

id = "34in_standard_jazz"
name = "34\" Standard Jazz Bass"
scale_length_in = 34.0
scale_length_m = 0.8636

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard nickel roundwounds (D'Addario EXL165 / Fender 7250M .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. JAZZ NECK SINGLE-COIL (Solo Neck)
# ------------------------------------------------------------------------------
[pickups.neck]
name = "Jazz Neck Single-Coil"
position_from_bridge_m = 0.1480  # 148.0mm from bridge
aperture_width_in = 0.75         # 0.75" narrow single-coil aperture
coil_spacing_in = 0.0
type = "single_coil"
resonant_frequency_hz = 3600.0   # Neck single-coil loaded resonance (3.6 kHz)
q_factor = 1.50
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1480, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 2. 70s JAZZ BRIDGE SINGLE-COIL (Solo Bridge)
# ------------------------------------------------------------------------------
[pickups.bridge]
name = "70s Jazz Bridge Single-Coil"
position_from_bridge_m = 0.0406  # 40.6mm from bridge (70s datum)
aperture_width_in = 0.75         # 0.75" narrow single-coil aperture
coil_spacing_in = 0.0
type = "single_coil"
resonant_frequency_hz = 3200.0   # Bridge single-coil loaded resonance (3.2 kHz)
q_factor = 1.60
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0406, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 3. JAZZ NECK + BRIDGE PARALLEL (Both Volumes 100%)
# ------------------------------------------------------------------------------
[pickups.pair_parallel]
name = "Jazz Neck + Bridge Parallel"
position_from_bridge_m = 0.0880  # Acoustic centroid
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "composite"
resonant_frequency_hz = 3900.0   # Combined parallel equivalent resonance (3.9 kHz)
q_factor = 1.30
components = [
    { pickup = "neck", weight = 0.5 },
    { pickup = "bridge", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 4. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the player to select the closest physical pickup state on the Jazz Bass:
#   - Neck Solo: P-Bass styles, Mudbucker, and Upright acoustic fullness
#   - Bridge Solo: 70s Bridge growl, StingRay bite, and Rickenbacker clank
#   - Both Parallel: Classic dual-single scooped slap and modern hybrid tones

[pickup_mapping]
"01_jazz_bass_pair" = "pair_parallel"          # Both pickups in parallel (identity)
"02_jazz_bridge_70s" = "bridge"                 # Solo bridge single-coil (identity)
"03_modern_p_ceramic" = "neck"                  # Solo neck single-coil (closest to P-bass position)
"04_vintage_62_p_alnico" = "neck"               # Solo neck single-coil (closest to P-bass position)
"05_p_bass_47nf_rolloff" = "neck"               # Solo neck single-coil
"06_pj_hybrid_parallel" = "pair_parallel"       # Dual pickups in parallel
"07_stingray_mm_parallel" = "bridge"            # Solo bridge pickup
"08_rickenbacker_bridge_hpf" = "bridge"         # Solo bridge pickup
"09_pmm_hybrid_series" = "pair_parallel"        # Dual pickups in parallel
"10_mudbucker_ultra_series" = "neck"            # Solo neck pickup
"11_dingwall_multiscale_bridge" = "bridge"      # Solo bridge pickup
"12_upright_bridge_transducer" = "neck"         # Solo neck pickup for acoustic fullness
