# ==============================================================================
# PASSIVIZER SOURCE INSTRUMENT CONFIGURATION
# 34" Standard Scale Jazz Bass (Neck + Bridge Single Coils)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm total, 431.8mm 12th fret to bridge saddle)
#   - 60s/Modern Neck Single-Coil: 155.6mm from bridge saddle (276.2mm from 12th fret, 10 7/8")
#   - 60s/Modern Bridge Single-Coil: 63.5mm from bridge saddle (368.3mm from 12th fret, 14 1/2")
#   - Pickup Spacing: 92.1mm (3 5/8" center-to-center)
#   - Coil Aperture: 0.75" (19.05mm) narrow single-coil magnetic sensing envelope
# Electronics:
#   - Passive high-impedance circuit: Dual 250k volume pots (V/V/T), 250k master tone (47nF cap).
#   - Parallel summing loaded resonance: 3.90 kHz, Q = 1.30.
#   - Solo Neck loaded resonance: 3.60 kHz, Q = 1.50.
#   - Solo Bridge loaded resonance: 3.20 kHz, Q = 1.60.

id = "34in_standard_jazz"
name = "34\" Standard Jazz Bass"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [71.16, 95.00, 126.81, 169.27]

default_pickup = "pair_parallel"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with standard nickel roundwounds (D'Addario EXL165 / Fender 7250M .045-.105).
[strings]
preset = "roundwound_nickel_standard"
brand = "D'Addario"
model = "EXL165"
gauge = "45-105"
core = "hex"
wrap = "nickel_round"
tension_lbs = 171.0

# ------------------------------------------------------------------------------
# 1. JAZZ NECK SINGLE-COIL (Solo Neck)
# ------------------------------------------------------------------------------
[pickups.neck]
name = "Jazz Neck Single-Coil"
position_from_bridge_m = 0.1556  # 155.6mm from bridge (10 7/8" from 12th fret)
aperture_width_in = 0.75         # 0.75" narrow single-coil aperture
coil_spacing_in = 0.0
type = "single_coil"
circuit = "circuits/sources/source_standard_jazz_neck.cir"
resonant_frequency_hz = 3600.0   # Neck single-coil loaded resonance (3.6 kHz)
q_factor = 1.50
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 2. 60s JAZZ BRIDGE SINGLE-COIL (Solo Bridge)
# ------------------------------------------------------------------------------
[pickups.bridge]
name = "60s Jazz Bridge Single-Coil"
position_from_bridge_m = 0.0635  # 63.5mm from bridge (14 1/2" from 12th fret)
aperture_width_in = 0.75         # 0.75" narrow single-coil aperture
coil_spacing_in = 0.0
type = "single_coil"
circuit = "circuits/sources/source_standard_jazz_bridge.cir"
resonant_frequency_hz = 3200.0   # Bridge single-coil loaded resonance (3.2 kHz)
q_factor = 1.60
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 3. JAZZ NECK + BRIDGE PARALLEL (Both Volumes 100%)
# ------------------------------------------------------------------------------
[pickups.pair_parallel]
name = "Jazz Neck + Bridge Parallel"
position_from_bridge_m = 0.1095  # Acoustic centroid
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "composite"
circuit = "circuits/sources/source_standard_jazz_pair.cir"
resonant_frequency_hz = 3900.0   # Combined parallel equivalent resonance (3.9 kHz)
q_factor = 1.30
components = [
    { pickup = "neck", weight = 0.5 },
    { pickup = "bridge", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 4. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
# Directs the player to select the closest physical pickup state on the Jazz Bass:
#   - Neck Solo: P-Bass styles, Mudbucker, and Upright acoustic fullness
#   - Bridge Solo: 60s Bridge growl, StingRay bite, and Rickenbacker clank
#   - Both Parallel: Classic dual-single scooped slap and modern hybrid tones

[pickup_mapping]
"01_modern_jazz_active" = "pair_parallel"          # Both pickups in parallel (active twin)
"02_jazz_bass_pair" = "pair_parallel"          # Both pickups in parallel (identity)
"03_jazz_bridge_60s" = "bridge"                # Solo bridge single-coil (identity)
"04_modern_p_ceramic" = "neck"                  # Solo neck single-coil (closest to P-bass position)
"05_vintage_62_p_alnico" = "neck"               # Solo neck single-coil (closest to P-bass position)
"06_p_bass_47nf_rolloff" = "neck"               # Solo neck single-coil
"07_modern_pj_active" = "pair_parallel"   # Modern Active P/J
"08_vintage_pj_passive" = "pair_parallel"  # Vintage Alnico P/J
"09_stingray_mm_parallel" = "bridge"            # Solo bridge pickup
"10_rickenbacker_bridge_hpf" = "bridge"         # Solo bridge pickup
"11_pmm_hybrid_series" = "pair_parallel"        # Dual pickups in parallel
"12_mudbucker_ultra_series" = "neck"            # Solo neck pickup
"13_dingwall_multiscale_bridge" = "bridge"      # Solo bridge pickup
"14_upright_bridge_transducer" = "neck"         # Solo neck pickup for acoustic fullness
