# ==============================================================================
# PASSIVIZER SOURCE INSTRUMENT CONFIGURATION
# 32" Medium Scale Fretless Bass with Reverse EMG PCSX and EMG MMTWX (ABCX Active Blend)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 32.0" (812.8mm total, 406.4mm 12th fret mark to bridge saddle)
#   - Reverse EMG PCSX Split: Centerline 266.0mm from 12th fret = 140.4mm from bridge saddle
#       - D/G half (forward towards neck): 154.4mm from bridge (252.0mm from 12th fret)
#       - E/A half (rearward towards bridge): 126.4mm from bridge (280.0mm from 12th fret)
#   - EMG MMTWX: 62.2mm centerline (Neck coil @ 73.7mm, Bridge coil @ 50.8mm)
# Electronics:
#   - Active 18V EMG ABCX active blend control (op-amp buffered parallel summing).
#   - Reverse PCSX: Ceramic/steel magnets, 2.61 kHz active resonance, Q = 1.35.
#   - MMTWX push/pull on volume pot toggles between single-coil (J mode @ 50.8mm, pushed down) and dual-coil (MM mode, pulled up).
#   - Upright Blend: 85% Reverse PCSX + 15% MMTWX Single-Coil for acoustic bridge clarity.

id = "32in_fretless_pmm"
name = "32\" Fretless Custom (EMG PCSX + MMTWX)"
scale_length_in = 32.0
scale_length_m = 0.8128
electronics = "active"

# String wave speeds: v = 2 * L * f0 (for E1=41.2Hz, A1=55.0Hz, D2=73.4Hz, G2=98.0Hz)
string_wave_speeds = [66.98, 89.41, 119.35, 159.31]

default_pickup = "pcsx"

# ------------------------------------------------------------------------------
# Physical Strings Configuration (Source Instrument Setup)
# ------------------------------------------------------------------------------
# Strung with La Bella Low Tension Flats (LTF-4A): smooth stainless flat ribbon
# wound over flexible round core. Lower tension (~132 lbs) and early viscoelastic
# damping deliver woody upright-like thump and fingerboard mwah.
[strings]
preset = "flatwound_low_tension"
brand = "La Bella"
model = "LTF-4A"
gauge = "43-100"
core = "round"
wrap = "stainless_flat"
tension_lbs = 132.0

# ------------------------------------------------------------------------------
# 1. REVERSE EMG PCSX SPLIT-COIL (Neck Solo)
# ------------------------------------------------------------------------------
# Reverse split layout with forward D/G coil half (154.4mm) and rearward E/A coil half (126.4mm).
# Centerline located exactly 266.0mm from 12th fret mark (140.4mm from bridge).
[pickups.pcsx]
name = "Reverse EMG PCSX Split-Coil (Neck)"
position_from_bridge_m = 0.1404  # 140.4mm centerline (266.0mm from 12th fret)
aperture_width_in = 1.10         # 1.10" aperture per split half
coil_spacing_in = 0.0
type = "split_coil"
resonant_frequency_hz = 2610.0   # Ceramic/steel active X-series resonance
q_factor = 1.35
coils = [
    # D/G strings see forward coil half (closer to neck for warm acoustic bloom)
    { strings = ["D", "G"], position_from_bridge_m = 0.1544, aperture_width_in = 1.10, weight = 1.0 },
    # E/A strings see rearward coil half (closer to bridge for tight fundamental definition)
    { strings = ["E", "A"], position_from_bridge_m = 0.1264, aperture_width_in = 1.10, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 2. EMG MMTWX SINGLE-COIL (Bridge Solo - Push/Pull Down: J Mode)
# ------------------------------------------------------------------------------
# Active single-coil mode using bridge-side stacked coils (L2+L3) at 50.8mm (2.0" from bridge).
# Selected when MMTWX volume pot is pushed down.
[pickups.mmtwx_single]
name = "EMG MMTWX Single-Coil (Bridge)"
position_from_bridge_m = 0.0508  # 50.8mm from bridge (2.0")
aperture_width_in = 0.75         # Narrow 0.75" Jazz bridge aperture
coil_spacing_in = 0.0
type = "single_coil"
resonant_frequency_hz = 3500.0   # High single-coil active resonance
q_factor = 1.40
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0508, aperture_width_in = 0.75, weight = 1.0 }
]

# ------------------------------------------------------------------------------
# 3. EMG MMTWX DUAL-COIL (Bridge Solo - Push/Pull Up: MM Mode)
# ------------------------------------------------------------------------------
# Humbucking Music Man mode superimposing neck coil (73.7mm) and bridge coil (50.8mm).
# Selected when MMTWX volume pot is pulled up.
[pickups.mmtwx_dual]
name = "EMG MMTWX Dual-Coil (Centerline)"
position_from_bridge_m = 0.0622  # 62.2mm centerline (2.45")
aperture_width_in = 1.50         # Dual-coil housing aperture
coil_spacing_in = 0.90           # 0.90" (22.86mm) spacing between coil centers
type = "dual_coil_parallel"
resonant_frequency_hz = 2500.0   # Active dual-coil resonance
q_factor = 1.35
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0737, aperture_width_in = 0.75, weight = 0.5 }, # Neck coil
    { strings = ["all"], position_from_bridge_m = 0.0508, aperture_width_in = 0.75, weight = 0.5 }  # Bridge coil
]

# ------------------------------------------------------------------------------
# 4. ACTIVE PARALLEL P/MM BLEND (EMG ABCX Center Detent - Push/Pull Up: MM Mode)
# ------------------------------------------------------------------------------
[pickups.blend_parallel]
name = "EMG PCSX + MMTWX Parallel (Center Detent)"
position_from_bridge_m = 0.1013  # Acoustic centroid
aperture_width_in = 0.88
coil_spacing_in = 0.0
type = "composite"
resonant_frequency_hz = 2555.0
q_factor = 1.35
components = [
    { pickup = "pcsx", weight = 0.5 },
    { pickup = "mmtwx_dual", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 5. ACTIVE PARALLEL P/J BLEND (EMG ABCX Center Detent - Push/Pull Down: J Mode)
# ------------------------------------------------------------------------------
[pickups.pj_blend_parallel]
name = "EMG PCSX + MMTWX Single Parallel (P/J Mode)"
position_from_bridge_m = 0.0956  # Acoustic centroid
aperture_width_in = 0.88
coil_spacing_in = 0.0
type = "composite"
resonant_frequency_hz = 3055.0
q_factor = 1.38
components = [
    { pickup = "pcsx", weight = 0.5 },
    { pickup = "mmtwx_single", weight = 0.5 }
]

# ------------------------------------------------------------------------------
# 6. UPRIGHT COMPOSITE BLEND (85% PCSX + 15% MMTWX Single - Push/Pull Down: J Mode)
# ------------------------------------------------------------------------------
# Optimized blend for acoustic upright emulation: 85% neck split-coil for woody body,
# 15% bridge single-coil for bridge-wing piezo transient definition.
[pickups.upright_blend]
name = "Fretless Upright Blend (85% PCSX + 15% MMTWX Single)"
position_from_bridge_m = 0.1270  # Acoustic centroid
aperture_width_in = 1.05
coil_spacing_in = 0.0
type = "composite"
resonant_frequency_hz = 2743.0
q_factor = 1.36
components = [
    { pickup = "pcsx", weight = 0.85 },
    { pickup = "mmtwx_single", weight = 0.15 }
]

# ------------------------------------------------------------------------------
# 7. SMART VOICE MAPPING
# ------------------------------------------------------------------------------
[pickup_mapping]
"01_modern_jazz_active" = "pj_blend_parallel"
"02_jazz_bass_pair" = "pj_blend_parallel"
"02b_jazz_bass_pair_22nf" = "pj_blend_parallel"
"03_jazz_bridge_60s" = "mmtwx_single"
"04_modern_p_ceramic" = "pcsx"
"05_vintage_62_p_alnico" = "pcsx"
"05b_vintage_62_p_22nf" = "pcsx"
"05c_vintage_62_p_47nf" = "pcsx"
"05d_vintage_50s_p_100nf" = "pcsx"
"07_modern_pj_active" = "pj_blend_parallel"   # Modern Active P/J
"08_vintage_pj_passive" = "pj_blend_parallel"  # Vintage Alnico P/J
"09_stingray_mm_parallel" = "mmtwx_dual"
"10_rickenbacker_bridge_hpf" = "mmtwx_single"
"11_pmm_hybrid_series" = "blend_parallel"
"12_mudbucker_ultra_series" = "pcsx"
"13_dingwall_multiscale_bridge" = "mmtwx_dual"
"14_upright_bridge_transducer" = "upright_blend"
