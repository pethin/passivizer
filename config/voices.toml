# ==============================================================================
# PASSIVIZER TARGET VOICES SPECIFICATION
# ==============================================================================
# Each table entry defines a target high-impedance passive pickup digital twin.
# Voices share the exact same flexible multi-coil schema as source instruments,
# supporting string-bound coil halves (e.g. P-Bass split coils) and arbitrary
# coil counts (e.g. 3-coil P/J, 4-coil P/MM).
#
# Field Definitions:
#   name        : Human-readable display name (embedded in NAM metadata).
#   circuit     : Path to the standalone SPICE netlist (.cir) for transient modeling.
#   topology    : Circuit topology classification (Single, Split, Dual, Series, Parallel).
#   description : Tonal character, reference pickup model, and hardware notes.
#   fr          : Target electrical resonant peak frequency under load (Hz).
#   Q           : Target electrical quality factor under pot and cable load.
#   gain_db     : Output gain trim in dB for perceived loudness matching.
#   scale       : Reference scale length key from scales.toml ("34in", "multiscale", "upright").
#   hpf         : (Optional) High-pass cutoff frequency in Hz (e.g. 105Hz for Rickenbacker).
#   coils       : Array of physical coil definitions with string bindings and positions:
#                 - strings: ["all"], [1, 2] (treble), or [3, 4] (bass)
#                 - position_from_bridge_m: distance from bridge saddle in meters
#                 - aperture_width_in: coil magnetic sensing aperture in inches
#                 - weight: amplitude weighting (e.g. 0.5 for parallel/series coils)
#                 - polarity: phase polarity (+1.0 in-phase, -1.0 reverse)
# ==============================================================================

# ------------------------------------------------------------------------------
# 01. MODERN ACTIVE JAZZ BASS PAIR
# ------------------------------------------------------------------------------
# Dual single-coil Jazz pickups in 60s spacing (155.6mm neck, 63.5mm bridge) with
# onboard high-impedance active buffer and Sadowsky-style 2-band boost (+3.5 dB @ 40 Hz,
# +3.5 dB @ 4 kHz). Coils are isolated from cable capacitance for wideband clarity and sparkle.
[voices.01_modern_jazz_active]
name = "01. Modern Active Jazz Bass Pair"
circuit = "circuits/01_modern_jazz_active.cir"
topology = "Dual Single-Coil Active Buffer"
description = "Dual single-coils in 60s spacing with active 2-band boost (+3.5 dB @ 40 Hz, +3.5 dB @ 4 kHz) and cable isolation"
blend_mode = "parallel"
magnet_type = "alnico_v"
alpha = 0.25
fr = 4800.0  # High resonant peak due to zero cable capacitive loading on coils
Q = 1.6
gain_db = 1.0
scale = "34in"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 0.5 }, # 60s Neck Single-Coil
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 0.5 }  # 60s Bridge Single-Coil
]

[[voices.01_modern_jazz_active.pickups]]
name = "Modern Jazz Single-Coil (Neck)"
type = "single_coil"
magnet_type = "alnico_v"
