# ==============================================================================
# PASSIVIZER TARGET VOICES SPECIFICATION
# ==============================================================================
# Each table entry defines a target high-impedance passive pickup digital twin.
# Voices share the exact same flexible multi-coil schema as source instruments,
# supporting string-bound coil halves (e.g. P-Bass split coils) and arbitrary
# coil counts (e.g. 3-coil P/J, 4-coil P/MM).
#
# Field Definitions:
#   name        : Human-readable display name (embedded in NAM metadata).
#   circuit     : Path to the standalone SPICE netlist (.cir) for transient modeling.
#   topology    : Circuit topology classification (Single, Split, Dual, Series, Parallel).
#   description : Tonal character, reference pickup model, and hardware notes.
#   fr          : Target electrical resonant peak frequency under load (Hz).
#   Q           : Target electrical quality factor under pot and cable load.
#   gain_db     : Output gain trim in dB for perceived loudness matching.
#   scale       : Reference scale length key from scales.toml ("34in" or "multiscale").
#   hpf         : (Optional) High-pass cutoff frequency in Hz (e.g. 105Hz for Rickenbacker).
#   coils       : Array of physical coil definitions with string bindings and positions:
#                 - strings: ["all"], ["E", "A"], or ["D", "G"]
#                 - position_from_bridge_m: distance from bridge saddle in meters
#                 - aperture_width_in: coil magnetic sensing aperture in inches
#                 - weight: amplitude weighting (e.g. 0.5 for parallel/series coils)
#                 - polarity: phase polarity (+1.0 in-phase, -1.0 reverse)
# ==============================================================================

# ------------------------------------------------------------------------------
# 01. JAZZ BASS PAIR (PARALLEL)
# ------------------------------------------------------------------------------
# Two narrow single-coils in parallel spaced 92.1mm (3 5/8") apart (60s/modern spacing),
# creating the signature scooped mid comb filtering of a dual-pickup Jazz Bass.
[voices.01_jazz_bass_pair]
name = "01. Jazz Bass Pair (Parallel)"
circuit = "circuits/01_jazz_bass_pair.cir"
topology = "Dual Single-Coil Parallel"
description = "Dual narrow single-coils in parallel with wide-aperture phase cancellation"
blend_mode = "parallel"
fr = 3900.0  # Composite equivalent resonant peak
Q = 1.3      # Composite equivalent quality factor
gain_db = -0.5
scale = "34in"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 0.5 }, # 60s Neck Single-Coil (10 7/8" from 12th fret)
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 0.5 }  # 60s Bridge Single-Coil (14 1/2" from 12th fret)
]

[[voices.01_jazz_bass_pair.pickups]]
name = "Jazz Single-Coil (Neck)"
type = "single_coil"
fr = 3600.0
Q = 1.5
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 1.0 }
]

[[voices.01_jazz_bass_pair.pickups]]
name = "60s Jazz Single-Coil (Bridge)"
type = "single_coil"
fr = 3200.0
Q = 1.6
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]

