# ------------------------------------------------------------------------------
# 02. JAZZ BASS PAIR (PARALLEL)
# ------------------------------------------------------------------------------
# Two narrow single-coils in parallel spaced 92.1mm (3 5/8") apart (60s/modern spacing),
# loaded with authentic dual 250k volume pots (125k net load) and 250k tone pot.
id = "02_jazz_bass_pair"
name = "02. Jazz Bass Pair (Parallel)"
circuit = "circuits/02_jazz_bass_pair.cir"
topology = "Dual Single-Coil Parallel"
description = "Dual narrow single-coils in parallel with wide-aperture phase cancellation"
blend_mode = "parallel"
magnet_type = "alnico_v"
alpha = 0.25
fr = 3900.0  # Composite equivalent resonant peak
Q = 1.3      # Composite equivalent quality factor
gain_db = -0.5
scale = "34in"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 0.5 }, # 60s Neck Single-Coil (10 7/8" from 12th fret)
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 0.5 }  # 60s Bridge Single-Coil (14 1/2" from 12th fret)
]

[[pickups]]
name = "Jazz Single-Coil (Neck)"
type = "single_coil"
magnet_type = "alnico_v"
alpha = 0.25
fr = 3600.0
Q = 1.5
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 1.0 }
]

[[pickups]]
name = "60s Jazz Single-Coil (Bridge)"
type = "single_coil"
magnet_type = "alnico_v"
alpha = 0.28
fr = 3200.0
Q = 1.6
weight = 0.5
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 1.0 }
]
