# ------------------------------------------------------------------------------
# 02b. JAZZ BASS PAIR (22nF TONESTYLER SWEET SPOT)
# ------------------------------------------------------------------------------
# Two narrow single-coils in parallel with 22nF ToneStyler pure capacitive shunt
# (zero wiper resistance damping), yielding an active 762 Hz vocal midrange peak
# for authentic Jaco Pastorius / Marcus Miller bridge bite without treble clank.
id = "02b_jazz_bass_pair_22nf"
name = "02b. Jazz Bass Pair (22nF ToneStyler)"
circuit = "circuits/02b_jazz_bass_pair_22nf.cir"
topology = "Dual Single-Coil Parallel (22nF ToneStyler)"
description = "Dual single-coils in parallel with 22nF ToneStyler pure capacitive shunt (760 Hz vocal bump)"
blend_mode = "parallel"
magnet_type = "alnico_v"
alpha = 0.25
fr = 760.0
Q = 1.3
gain_db = -0.5
scale = "34in"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.1556, aperture_width_in = 0.75, weight = 0.5 },
    { strings = ["all"], position_from_bridge_m = 0.0635, aperture_width_in = 0.75, weight = 0.5 }
]

