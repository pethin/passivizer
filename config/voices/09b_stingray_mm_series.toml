# ------------------------------------------------------------------------------
# 09b. MUSIC MAN STINGRAY MM (SERIES HUMBUCKER)
# ------------------------------------------------------------------------------
# Dual-coil humbucker wired in series with 0.75" (19.05mm) spacing centered at 66.0mm,
# paired with authentic active 2-band preamp buffer (+1.8 dB @ 50 Hz, +2.2 dB @ 4-7 kHz).
# The series connection yields commanding output (+5.6 dB) and focused upper-mid resonance (fr ≈ 4.1 kHz),
# delivering the aggressive midrange growl of the StingRay 5 and Sterling 3-way toggle.
id = "09b_stingray_mm_series"
name = "09b. Music Man MM (Series Humbucker)"
circuit = "circuits/09b_stingray_mm_series.cir"
topology = "Dual-Coil Series Active Buffer"
description = "Dual-coil humbucker in series with authentic active 2-band preamp buffer (4.1 kHz active series resonance, +5.6 dB series punch)"
magnet_type = "alnico_v"
alpha = 0.22
fr = 4100.0  # Isolated from cable capacitance, authentic active series resonance
Q = 1.6
gain_db = 5.6
scale = "34in"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0755, aperture_width_in = 0.75, weight = 0.5 }, # Neck coil
    { strings = ["all"], position_from_bridge_m = 0.0565, aperture_width_in = 0.75, weight = 0.5 }  # Bridge coil
]
