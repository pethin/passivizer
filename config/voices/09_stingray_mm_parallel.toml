# ------------------------------------------------------------------------------
# 09. MUSIC MAN STINGRAY MM (PARALLEL HUMBUCKER)
# ------------------------------------------------------------------------------
# Dual-coil humbucker with 0.75" (19.05mm) spacing centered at 66.0mm, paired with
# authentic active 2-band preamp buffer (+1.8 dB @ 50 Hz, +2.2 dB @ 4-7 kHz).
id = "09_stingray_mm_parallel"
name = "09. Music Man MM (Parallel Humbucker)"
tone_name = "StingRay Parallel"
topology = "Dual-Coil Parallel Active Buffer"
description = "Dual-coil humbucker in parallel with authentic active 2-band preamp buffer (+1.8 dB @ 50 Hz, +2.2 dB @ 4-7 kHz)"
magnet_type = "alnico_v"
alpha = 0.22
fr = 4200.0  # Isolated from cable capacitance
Q = 1.6
gain_db = 0.0
scale = "34in"
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0755, aperture_width_in = 0.75, weight = 0.5 }, # Neck coil
    { strings = ["all"], position_from_bridge_m = 0.0565, aperture_width_in = 0.75, weight = 0.5 }  # Bridge coil
]

[circuit]
topology = "single"
L = 1.2
Rdc = 2200.0
Reddy = 75000.0
Ccoil = 1.8e-10
active = true
preamp = "stingray_2band"
Rvol = 500000.0
