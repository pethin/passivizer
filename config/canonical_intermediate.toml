# ==============================================================================
# CANONICAL INTERMEDIATE (Architecture C Universal Passive Reference Baseline)
# ==============================================================================
# Physical Datums:
#   - Scale Length: 34.0" (863.6mm standard Fender scale)
#   - Acoustic Datum: 93.5mm from bridge saddle (geometric centroid/median)
#   - Magnetic Aperture: Single sensing slit (w = 0.75", d = 0, zero comb nulls)
# Electrical Circuit:
#   - Wideband passive reference pickup (fr = 4.8 kHz, Q = 0.75, 500k vol, 500k tone, 330pF cable)
#   - Frequency Response: Clean 2nd-order roll-off eliminating ultrasonic deconvolution boost
# Dynamics:
#   - Pure linear reference (alpha = 0.0, V_sat = 10.0V)
# ==============================================================================

id = "canonical_intermediate"
name = "Canonical Intermediate Baseline"
scale_length_in = 34.0
scale_length_m = 0.8636
electronics = "passive"

# Reference wave speeds (34in standard scale, 6-string B0-C3 full register)
string_wave_speeds = [53.28, 71.16, 95.00, 126.81, 169.27, 225.69]

default_pickup = "canonical_median"

[strings]
preset = "roundwound_nickel_6string"

[pickups.canonical_median]
name = "Canonical 93.5mm Acoustic Median"
position_name = "Median"
position_from_bridge_m = 0.0935
aperture_width_in = 0.75
coil_spacing_in = 0.0
type = "single_coil"
magnet_type = "ideal"
pole_type = "rod"
resonant_frequency_hz = 4800.0
q_factor = 0.75
coils = [
    { strings = ["all"], position_from_bridge_m = 0.0935, aperture_width_in = 0.75, weight = 1.0, pole_type = "rod" }
]

[pickups.canonical_median.circuit]
topology = "single"
L = 3.2
Rdc = 6500.0
Reddy = 150000.0
Ccoil = 9e-11
active = false
preamp = "none"
R_out = 50.0
no_eq = false
Rvol = 500000.0
Rtone = 500000.0
Ctone = 4.7e-08
Ccable = 3.3e-10
