<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allomorph Master Voices: Frontend Deconvolutions (Block 1)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #38bdf8;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --tag-bg: #21262d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg) !important;
      color: #c9d1d9 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px 16px;
      margin: 0;
      overflow-x: hidden;
    }
    .header-card {
      max-width: 1060px;
      margin: 0 auto 12px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .inst-picker-select {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
    .inst-picker-select:focus {
      border-color: var(--accent);
    }
    .inst-tabs-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .inst-tab-btn {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .inst-tab-btn:hover {
      background: #30363d;
      color: var(--text);
    }
    .inst-tab-btn.active {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border-color: #38bdf8;
    }
    .chart-frame-wrap {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    .chart-frame {
      width: 100%;
      height: 720px;
      border: none;
      border-radius: 8px;
      background: var(--bg);
    }
    #pickup-sublevel { display: none; }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div class="header-card">
    <div class="header-row">
      <div class="header-title">
        <span>Frontend Deconvolutions (Block 1) — Per-Instrument Pickup Key Selector</span>
      </div>
      <div>
        <select id="inst-select" class="inst-picker-select" onchange="switchInstrument(this.value)">
        <option value="30in_emg_mmtw_frontend.html">30" Short Scale MM (EMG MMTW)</option>
        <option value="30in_mustang_pj_frontend.html">30" Mustang Bass PJ (Short Scale)</option>
        <option value="32in_custom_pmm_frontend.html">32" Medium Scale Custom (EMG PX + MMTWX)</option>
        <option value="32in_fretless_pmm_frontend.html">32" Fretless Custom (EMG PCSX + MMTWX)</option>
        <option value="34in_active_stingray_frontend.html">34" Active StingRay (Music Man MM)</option>
        <option value="34in_dingwall_sp1_frontend.html">Dingwall SP1 5-String (32"-35" Super P)</option>
        <option value="34in_emg_soapbar_frontend.html">34" 5-String Active EMG Soapbar Bass (EMG 40)</option>
        <option value="34in_preamp_soapbar_frontend.html">34" Preamp Soapbar Bass (Dual Humbuckers)</option>
        <option value="34in_standard_jazz_frontend.html">34" Standard Jazz Bass</option>
        <option value="34in_standard_p_frontend.html">34" Standard P-Bass</option>
        <option value="34in_standard_pj_frontend.html">34" Standard P/J Bass</option>
        <option value="37in_multiscale_dingwall_frontend.html">37" Multi-Scale Dingwall 5-String (FD3n)</option>
        </select>
      </div>
    </div>
    <div class="inst-tabs-wrap">
      <button class="inst-tab-btn active" data-url="30in_emg_mmtw_frontend.html" onclick="switchInstrument('30in_emg_mmtw_frontend.html', this)">30" Short Scale MM (EMG MMTW)</button>
      <button class="inst-tab-btn" data-url="30in_mustang_pj_frontend.html" onclick="switchInstrument('30in_mustang_pj_frontend.html', this)">30" Mustang Bass PJ (Short Scale)</button>
      <button class="inst-tab-btn" data-url="32in_custom_pmm_frontend.html" onclick="switchInstrument('32in_custom_pmm_frontend.html', this)">32" Medium Scale Custom (EMG PX + MMTWX)</button>
      <button class="inst-tab-btn" data-url="32in_fretless_pmm_frontend.html" onclick="switchInstrument('32in_fretless_pmm_frontend.html', this)">32" Fretless Custom (EMG PCSX + MMTWX)</button>
      <button class="inst-tab-btn" data-url="34in_active_stingray_frontend.html" onclick="switchInstrument('34in_active_stingray_frontend.html', this)">34" Active StingRay (Music Man MM)</button>
      <button class="inst-tab-btn" data-url="34in_dingwall_sp1_frontend.html" onclick="switchInstrument('34in_dingwall_sp1_frontend.html', this)">Dingwall SP1 5-String (32"-35" Super P)</button>
      <button class="inst-tab-btn" data-url="34in_emg_soapbar_frontend.html" onclick="switchInstrument('34in_emg_soapbar_frontend.html', this)">34" 5-String Active EMG Soapbar Bass (EMG 40)</button>
      <button class="inst-tab-btn" data-url="34in_preamp_soapbar_frontend.html" onclick="switchInstrument('34in_preamp_soapbar_frontend.html', this)">34" Preamp Soapbar Bass (Dual Humbuckers)</button>
      <button class="inst-tab-btn" data-url="34in_standard_jazz_frontend.html" onclick="switchInstrument('34in_standard_jazz_frontend.html', this)">34" Standard Jazz Bass</button>
      <button class="inst-tab-btn" data-url="34in_standard_p_frontend.html" onclick="switchInstrument('34in_standard_p_frontend.html', this)">34" Standard P-Bass</button>
      <button class="inst-tab-btn" data-url="34in_standard_pj_frontend.html" onclick="switchInstrument('34in_standard_pj_frontend.html', this)">34" Standard P/J Bass</button>
      <button class="inst-tab-btn" data-url="37in_multiscale_dingwall_frontend.html" onclick="switchInstrument('37in_multiscale_dingwall_frontend.html', this)">37" Multi-Scale Dingwall 5-String (FD3n)</button>
    </div>
  </div>

  <div id="pickup-sublevel"></div>

  <div class="chart-frame-wrap">
    <iframe id="frontend-frame" class="chart-frame" src="30in_emg_mmtw_frontend.html" title="Per-Instrument Frontend Deconvolutions Chart"></iframe>
  </div>

  <script>
    // vegaEmbed reference for embedded and sub-frame charts
    if (typeof vegaEmbed !== 'undefined') {
      window.vegaEmbed = vegaEmbed;
    }
    function switchInstrument(url, btnEl) {
      const frame = document.getElementById('frontend-frame');
      if (frame) frame.src = url;
      const sel = document.getElementById('inst-select');
      if (sel) sel.value = url;
      document.querySelectorAll('.inst-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-url') === url);
      });
    }
  </script>
</body>
</html>
