[project]
name = "allomorph"
version = "0.1.0"
description = "Analog digital twin & universal pickup/transducer modeling engine"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.14"
dependencies = [
    "polars>=1.20.0",
    "altair>=5.5.0",
    "pedalboard>=0.9.0",
    "neural-amp-modeler>=0.13.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "numba>=0.67.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
allomorph = "allomorph.cli:main"
allomorph-sim = "allomorph.circuit:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyrefly]
preset = "strict"
project-includes = [
    "**/*.py*",
]
search-path = ["src", "scripts"]


