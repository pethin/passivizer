[project]
name = "allomorph"
version = "0.1.0"
description = "Analog digital twin & universal pickup/transducer modeling engine"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.14"
dependencies = [
    "polars>=1.20.0",
    "altair>=5.5.0",
    "pedalboard>=0.9.0",
    "neural-amp-modeler>=0.13.0",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
allomorph = "allomorph.cli:main"
allomorph-sim = "allomorph.circuit:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]


