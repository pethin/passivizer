[project]
name = "passivizer"
version = "0.1.0"
description = "Digital twin & analog modeling pipeline for EMG bass pickups"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.14"
dependencies = [
    "polars>=1.20.0",
    "altair>=5.5.0",
    "pedalboard>=0.9.0",
    "neural-amp-modeler>=0.13.0",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
